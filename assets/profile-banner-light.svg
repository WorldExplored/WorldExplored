<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Srreyansh Sethi profile banner</title>
  <desc id="desc">Light banner for machine learning systems, LLM inference, and GPU computing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="0.56" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f5f1ff"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.18"/>
