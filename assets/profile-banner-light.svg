  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glowA)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glowB)"/>
  <rect x="1" y="1" width="1278" height="318" rx="23" fill="none" stroke="#0f172a" stroke-opacity="0.10"/>
  <rect width="1280" height="320" rx="24" fill="url(#grid)"/>

  <g opacity="0.9">
    <path d="M845 82 C925 42 1010 52 1066 108 C1128 170 1178 167 1248 116" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M818 230 C915 170 1009 190 1075 238 C1124 274 1181 270 1245 224" fill="none" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
    <path d="M892 54 L892 256 M978 38 L978 276 M1064 58 L1064 258 M1150 42 L1150 278" stroke="#2563eb" stroke-opacity="0.08" stroke-width="1"/>

